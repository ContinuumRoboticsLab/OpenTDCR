name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: tdcr inspect --config configs/three_segment.example.json
      - run: tdcr teleop --config configs/three_segment.example.json --commands '1 w 2 a 3 s home q'
      - run: python -m opentdcr sensor --sensor examples.sensor_adapter:create_sensor --samples 3
      - run: tdcr calibrate --config configs/three_segment.example.json --calibration-config configs/calibration.example.json --teleop --commands 'w home q'
